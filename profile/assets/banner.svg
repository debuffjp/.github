<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="debuff: open tools for 2D web games">
<style>
.buff{transform-box:fill-box;transform-origin:50% 100%;animation:hop 1.6s cubic-bezier(.3,0,.3,1) infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.18,.82)}15%{transform:translateY(0) scale(.9,1.12)}45%{transform:translateY(-46px) scale(.96,1.04)}75%{transform:translateY(0) scale(1.2,.8)}85%{transform:translateY(0) scale(.97,1.03)}}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.pop{font:700 26px ui-monospace,Menlo,Consolas,monospace;opacity:0;animation:pop 4.4s ease-out infinite}
@keyframes pop{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:translateY(0)}55%{opacity:1}75%,100%{opacity:0;transform:translateY(-30px)}}
.tag{font:600 20px ui-monospace,Menlo,Consolas,monospace;fill:#e7fd96}
</style>
